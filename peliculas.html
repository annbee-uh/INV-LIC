<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Netflix</title>
    <!--Icono metadato-->
    <link rel="icon" href="img/logo(N).png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

    <link rel="stylesheet" href="css/stylen.css">
    <link rel="stylesheet" href="css/pc.css">
    <link rel="stylesheet" href="css/movil.css">
</head>

<body>
    <main>

        <!-- ################################################################################
         VERSIÓN PC / TABLET
         Se ve desde 768px (md) hacia arriba:
           d-none     = oculto en el celular
           d-md-block = visible desde tablet
         Estilos en: css/pc.css
         ################################################################################ -->
        <div id="version-pc" class="d-none d-md-block">

            <!-- ===== ENCABEZADO PC: logo a la izquierda, avatar a la derecha ===== -->
            <header class="encabezado">
                <nav class="menu">
                    <img class="logo" src="img/NetflixLogo.jpg" width="100" alt="Logo de Netflix">
                    <ul class="seleccion-menu">
                        <li><a href="peliculas.html">Inicio</a></li>
                        <li><a href="peliculas.html">Series TV</a></li>
                        <li><a href="peliculas.html">Películas</a></li>
                        <li><a href="peliculas.html">Nuevo & Popular</a></li>
                        <li><a href="peliculas.html">Mi Lista</a></li>
                    </ul>
                </nav>
                <img class="buscar" src="img/buscar.png" alt="Lupa">
                <img class="profile" src="img_profiles/profile1.png" width="50" alt="Profile image">
            </header>



            <section id="pc-banner">
                <img src="img/Frame 2.png" alt="">
            </section>


            <br>
            <!--CARRUSEL 1 Tendencias-->
            <section id="carrusel-pc-1" class="carrusel-pc px-5">
                <section class="fila-tendencias">
                    <h3>Tendencias ahora</h3>
                    <img src="img/flecha-roja.png" height="20px" width="20px" alt="vector flecha roja">
                </section>
                <div id="carruselIndicadores" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active"> <!--Posters pestaña 1-->
                            <div class="row g-4">
                                <div class="col-2"><img class="poster" src="img/Deadpool (2016).jpg"
                                        alt="Primera diapositiva"></div>
                                <div class="col-2"><img class="poster" src="img/Dexter (2006).jpg"
                                        alt="Segunda diapositiva"></div>
                                <div class="col-2"><img class="poster" src="img/Iron Man 2 (2010).jpg"
                                        alt="Tercera diapositiva"></div>
                                <div class="col-2"><img class="poster" src="img/Mentalist(2008).jpg"
                                        alt="Cuarta diapositiva"></div>
                                <div class="col-2"><img class="poster" src="img/The Super Mario Galaxy Movie (2026).jpg"
                                        alt="Quinta diapositiva">
                                </div>
                                <div class="col-2"><img class="poster" src="img/Eljuegodelcalamarportada(2021).jpg"
                                        alt="Sexta diapositiva"></div>

                            </div>
                        </div>
                        <div class="carousel-item"><!--Posters pestaña 2-->
                            <div class="carousel-item-active">
                                <div class="row g-4">
                                    <div class="col-2"><img class="poster" src="img/Wednesday(2022).jpg"
                                            alt="Séptima diapositiva"></div>
                                    <div class="col-2"><img class="poster" src="img/Shrek(20021).jpg"
                                            alt="Octava diapositiva"></div>
                                    <div class="col-2"><img class="poster" src="img/Mipobreangelito(1990).jpg"
                                            alt="Novena diapositiva"></div>
                                    <div class="col-2"><img class="poster" src="img/TopGun.jpg"
                                            alt="Decima diapositiva"></div>
                                    <div class="col-2"><img class="poster" src="img/Rick and Morty (2013).jpg"
                                            alt="Onceava diapositiva"></div>
                                    <div class="col-2"><img class="poster" src="img/Comoentrenaratudragon(2010).jpg"
                                            alt="Doceava diapositiva"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carruselIndicadores"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Anterior</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carruselIndicadores"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Siguiente</span>
                    </button>

                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#carruselIndicadores" data-bs-slide-to="0" class="active"
                            aria-current="true" aria-label="Diapositiva 1"></button>
                        <button type="button" data-bs-target="#carruselIndicadores" data-bs-slide-to="1"
                            aria-label="Diapositiva 2"></button>
                    </div>
                </div>
            </section>
            <br>
            <!--CARRUSEL 2 Animación y aventura-->

            <section id="carrusel-pc-2" class="carrusel-pc px-5">
                <section class="fila-animaven">
                    <h3>Animación y aventura</h3>
                    <img src="img/flecha-roja.png" height="20px" width="20px" alt="vector flecha roja">
                </section>
                <div id="carruselIndicadores2" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <div class="row g-4">
                                <div class="col-2"><img class="poster"
                                        src="img/anima-ventu/AvatarFuegoyCeniza(2025).jpg" alt="Primera diapositiva">
                                </div>
                                <div class="col-2"><img class="poster" src="img/anima-ventu/Coco(2017).jpg"
                                        alt="Segunda diapositiva"></div>
                                <div class="col-2"><img class="poster" src="img/anima-ventu/Elgatoconbotas(2022).jpg"
                                        alt="Tercera diapositiva"></div>
                                <div class="col-2"><img class="poster"
                                        src="img/anima-ventu/Elseñordelosanillos(2001).jpg" alt="Cuarta diapositiva">
                                </div>
                                <div class="col-2"><img class="poster" src="img/anima-ventu/HarryPotter(2001).jpg"
                                        alt="Quinta diapositiva">
                                </div>
                                <div class="col-2"><img class="poster" src="img/anima-ventu/KungFuPanda4(2024).jpg"
                                        alt="Sexta diapositiva"></div>

                            </div>
                        </div>
                        <div class="carousel-item">
                            <div class="carousel-item-active">
                                <div class="row g-4">
                                    <div class="col-2"><img class="poster" src="img/anima-ventu/LosCroods.jpg"
                                            alt="Séptima diapositiva"></div>
                                    <div class="col-2"><img class="poster"
                                            src="img/anima-ventu/Mivillanofavorito(2024).jpg" alt="Octava diapositiva">
                                    </div>
                                    <div class="col-2"><img class="poster" src="img/anima-ventu/RobotSalvaje.jpg"
                                            alt="Novena diapositiva"></div>
                                    <div class="col-2"><img class="poster" src="img/anima-ventu/Spider-Man(2018).jpg"
                                            alt="Decima diapositiva"></div>
                                    <div class="col-2"><img class="poster"
                                            src="img/anima-ventu/TransformersOne(2024).jpg" alt="Onceava diapositiva">
                                    </div>
                                    <div class="col-2"><img class="poster" src="img/anima-ventu/Vengadores(2018).jpg"
                                            alt="Doceava diapositiva"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carruselIndicadores2"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Anterior</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carruselIndicadores2"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Siguiente</span>
                    </button>

                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#carruselIndicadores2" data-bs-slide-to="0" class="active"
                            aria-current="true" aria-label="Diapositiva 1"></button>
                        <button type="button" data-bs-target="#carruselIndicadores2" data-bs-slide-to="1"
                            aria-label="Diapositiva 2"></button>
                    </div>
                </div>
            </section>

            <br><br><br><br>
            <!-- ===== PIE DE PÁGINA PC ===== -->
            <footer class="pie">
                <p>&#169 1997-2026 Netflix, Inc</p>
                <ul>
                    <li>Johanna Beatriz Hernández Guillen</li>
                    <li>William Ernesto Mata Pérez</li>
                    <li>Jesus Abraham Vides de León</li>
                </ul>
            </footer>

        </div>
        <!-- ############################ FIN VERSIÓN PC / TABLET ############################ -->


        <!-- ################################################################################
         VERSIÓN CELULAR
         Se ve solo por debajo de 768px:
           d-md-none = se oculta desde tablet hacia arriba
         Estilos en: css/movil.css
         ################################################################################ -->
        <div id="version-movil" class="d-md-none">

            <header id="movil-encabezado">

            </header>

            <nav id="movil-categorias">

            </nav>

            <section id="movil-destacado">

            </section>


            <section id="movil-categoria-1">

            </section>

            <section id="movil-categoria-2">

            </section>

            <section id="movil-categoria-3">

            </section>


            <nav id="movil-barra-inferior" class="fixed-bottom">

            </nav>

        </div>

    </main>


    <!-- SCRIPT BOOTSTRAP: siempre al final del body, para que funcionen los carruseles.
         No lo muevan ni lo borren. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</body>

</html>
